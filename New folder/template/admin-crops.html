<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APCNF-RySS Traceability - Crop Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <div class="admin-wrapper">
        <div id="admin-header-placeholder"></div>

        <main class="admin-content">


            <div class="card full-width-card">
                <h3><i class="fa-solid fa-list-check"></i> Crop Master List</h3>
                <div class="table-container" style="max-height: 600px; overflow-y: auto;">
                    <table class="data-table" id="crop-master-table">
                        <thead>
                            <tr>
                                <th>Crop ID</th>
                                <th>Crop Name</th>
                                <th>Shelf Life (Days)</th>
                                <th>Storage Conditions</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loaded via JS -->
                            <tr>
                                <td colspan="6" class="text-center">Loading crops...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div id="admin-footer-placeholder"></div>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/admin-crops.js"></script>
    <script src="../js/admin-loader.js"></script>

</body>

</html>
