<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APCNF-RySS Traceability - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            width: 100%;
            max-width: 520px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            border: 3px solid #143d14;
            overflow: hidden;
        }

        /* Header Section */
        .login-header {
            background: linear-gradient(135deg, #0a2a0a 0%, #143d14 100%);
            padding: 1.5rem 1.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .login-header .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .login-header h1 {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Form Section */
        .login-form-container {
            padding: 2.5rem 2rem 1.5rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.75rem;
        }

        .form-group .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #143d14;
        }

        .form-group input:focus~.input-icon {
            color: #143d14;
        }

        .form-group label {
            position: absolute;
            left: 2.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: #fff;
            padding: 0 0.5rem;
            color: #666;
            font-size: 1rem;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .form-group input:focus+label,
        .form-group input:not(:placeholder-shown)+label {
            top: 0;
            left: 0.75rem;
            font-size: 0.85rem;
            color: #143d14;
            font-weight: 500;
        }

        /* Error Message */
        .error-message {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #143d14 0%, #1a5a1a 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0a2a0a 0%, #143d14 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(20, 61, 20, 0.3);
        }

        .btn-login i {
            font-size: 1.1rem;
        }

        /* Forgot Password */
        .forgot-password {
            text-align: center;
            margin-top: 1.25rem;
        }

        .forgot-password a {
            color: #143d14;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Sign Up Section */
        .signup-section {
            padding: 1.5rem 2rem;
            background: #f9fafb;
            text-align: center;
            border-top: 1px solid #eee;
        }

        .signup-section p {
            color: #666;
            font-size: 0.95rem;
        }

        .signup-section a {
            color: #143d14;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-section a:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }

        .modal-header {
            background: #143d14;
            color: white;
            padding: 1.25rem 1.5rem;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.8;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 2rem;
            text-align: center;
        }

        .modal-body i.fa-info-circle {
            font-size: 3rem;
            color: #143d14;
            margin-bottom: 1rem;
        }

        .modal-body p {
            color: #444;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .modal-body .btn-ok {
            margin-top: 1.5rem;
            padding: 0.75rem 2rem;
            background: #143d14;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }

        .modal-body .btn-ok:hover {
            background: #0a2a0a;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .login-header {
                flex-direction: column;
                gap: 0.75rem;
            }

            .login-header h1 {
                font-size: 1.2rem;
            }

            .login-form-container {
                padding: 2rem 1.5rem 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <img src="../img/RYSS_Logo.png" alt="APCNF Logo" class="logo-img">
                <h1>APCNF-RySS Traceability Portal Login</h1>
            </div>

            <!-- Login Form -->
            <div class="login-form-container">
                <div id="errorMessage" class="error-message">
                    Invalid credentials. Please try again.
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <input type="text" id="username" name="username" placeholder=" " required>
                        <label for="username">Username</label>
                        <i class="fas fa-user input-icon"></i>
                    </div>

                    <div class="form-group">
                        <input type="password" id="password" name="password" placeholder=" " required>
                        <label for="password">Password</label>
                        <i class="fas fa-lock input-icon"></i>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>

                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPasswordModal(); return false;">Forgot Password?</a>
                    </div>
                </form>
            </div>

            <!-- Sign Up Section -->
            <div class="signup-section">
                <p>Don't have an account? <a href="apcnf.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> Password Reset</h3>
                <button class="modal-close" onclick="closeForgotPasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <i class="fas fa-info-circle"></i>
                <p>To reset your password, please contact the system administrator.</p>
                <p style="font-size: 0.9rem; color: #666;">The administrator will provide you with a new temporary
                    password.</p>
                <button class="btn-ok" onclick="closeForgotPasswordModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        function showForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.add('active');
        }

        function closeForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.remove('active');
        }

        // Close modal on outside click
        document.getElementById('forgotPasswordModal').addEventListener('click', function (e) {
            if (e.target === this) closeForgotPasswordModal();
        });
    </script>

    <script src="../js/mock-data.js"></script>
    <script src="../js/apcnf.js"></script>
    <script src="../js/login.js"></script>

</body>

</html>
