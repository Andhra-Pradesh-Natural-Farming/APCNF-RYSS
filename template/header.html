<header id="mainHeader" class="aggregator-header">
    <div class="header-content">
        <div class="logo-section">
            <img src="../img/RYSS_Logo.png" alt="RYSS APCNF Logo" class="logo-img">
            <div class="brand-text">
                <h1>APCNF-RySS</h1>
                <p class="subtitle">Traceability Portal</p>
            </div>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
                </li>
                <li><a href="catchment-area.html" class="nav-link"><i
                            class="fas fa-map-location-dot"></i><span>Catchment Area</span></a></li>
                <li><a href="mybatch.html" class="nav-link"><i class="fas fa-boxes-stacked"></i><span>My
                            Batches</span></a></li>
                <li><a href="buying-interest.html" class="nav-link"><i
                            class="fas fa-heart"></i><span>Interests</span></a></li>
                <li><a href="profile.html" class="nav-link"><i class="fas fa-user"></i><span>Aggregator</span></a></li>
            </ul>
        </nav>
        <div class="header-logout">
            <button class="logout-btn" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>
</header>
<script>
    // Logout function for all pages
    function handleLogout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        localStorage.removeItem('aggregatorId');
        localStorage.removeItem('aggregatorName');
        localStorage.removeItem('access_token');
        localStorage.removeItem('user_id');
        localStorage.removeItem('username');
        localStorage.removeItem('user_role');
        localStorage.removeItem('role');
        sessionStorage.clear();
        window.location.href = 'login.html';
    }

    // Set active nav link based on current page
    document.addEventListener('DOMContentLoaded', function () {
        const currentPage = window.location.pathname.split('/').pop();
        const navLinks = document.querySelectorAll('.aggregator-header .nav-link');
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });
    });
</script>
